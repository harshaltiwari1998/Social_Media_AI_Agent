name: Daily gaming and movie videos

# Makes the day's shorts - gaming (1 new/upcoming game, 3 classic games (our best performers), 1 Palworld breeding
# combo) -> HarryBeast Gaming YouTube only, and movies (1 new/upcoming movie, 1
# review/box-office) -> Name Writer YouTube + Instagram + Facebook, 1 Hindi movie reel ->
# Facebook + Instagram only - and retries uploads that
# failed earlier. No laptop needed. "What's already posted" lives on the gaming-state branch.
on:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST
  workflow_dispatch:
    inputs:
      new_games:
        description: "New/upcoming-game videos"
        default: "1"
      classic_games:
        description: "Classic-game videos"
        default: "3"
      new_palworld:
        description: "Palworld breeding videos"
        default: "1"
      new_movies:
        description: "New/upcoming-movie videos"
        default: "1"
      movie_reviews:
        description: "Movie review / box-office videos"
        default: "1"
      reels:
        description: "Hindi movie reels (Facebook + Instagram only)"
        default: "1"
      aniimo:
        description: "Aniimo guide shorts (HarryBeast)"
        default: "1"

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gaming:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - name: Restore trailer cache
        uses: actions/cache@v5
        with:
          # Steam trailers (minutes to download) and Wan-animated Pals (GPU quota) played inside the shorts.
          path: |
            backend/media_output/game_art/trailers
            backend/media_output/game_art/pal_motion
          key: trailers-${{ github.run_id }}
          restore-keys: trailers-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Hindi font and cloudflared
        run: |
          mkdir -p .cache/fonts
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o .cache/fonts/Hind-Bold.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf || curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o .cache/fonts/Hind-Bold.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hind/Hind-Bold.ttf
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o .cache/fonts/Hind-Regular.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Regular.ttf || curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o .cache/fonts/Hind-Regular.ttf https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hind/Hind-Regular.ttf
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 || echo "::warning::cloudflared download failed - Instagram uploads will retry next run"
          sudo chmod +x /usr/local/bin/cloudflared || true

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MOVIES_TOKEN_JSON: ${{ secrets.YOUTUBE_MOVIES_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json
          printf '%s' "$YOUTUBE_MOVIES_TOKEN_JSON" > .cache/youtube_token_movies.json

      - name: Make and post videos
        env:
          DRY_RUN: "false"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GAMING_PAGE_ID: ${{ secrets.META_GAMING_PAGE_ID }}
          META_GAMING_IG_USER_ID: ${{ secrets.META_GAMING_IG_USER_ID }}
          META_GAMING_ACCESS_TOKEN: ${{ secrets.META_GAMING_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # Wan animation of Pal art (game_videos.pal_motion)
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube","facebook_gaming","instagram_gaming"]'
          MOVIE_PLATFORMS: '["youtube_movies","instagram","facebook"]'
          YOUTUBE_CATEGORY_ID: "20"
          YOUTUBE_MOVIES_CATEGORY_ID: "24"
          CLOUDFLARED_PATH: /usr/local/bin/cloudflared
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/daily_job.py --skip-trends
          --new-games "${{ github.event.inputs.new_games || '1' }}"
          --classic-games "${{ github.event.inputs.classic_games || '3' }}"
          --new-palworld "${{ github.event.inputs.new_palworld || '1' }}"
          --new-movies "${{ github.event.inputs.new_movies || '1' }}"
          --movie-reviews "${{ github.event.inputs.movie_reviews || '1' }}"
          --extra-slot "reel:${{ github.event.inputs.reels || '1' }}"
          --extra-slot "aniimo:${{ github.event.inputs.aniimo || '1' }}"

      - name: Sort new uploads into YouTube playlists
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          YOUTUBE_NONINTERACTIVE: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/youtube_playlists.py

      - name: Save posting state
        if: always()
        run: |
          # Merge into the LATEST gaming-state (never copy over it): another workflow or a laptop batch may
          # have pushed since this run restored it. On a rejected push, fetch again and re-merge.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gaming-state
            state=$(mktemp -d)
            git worktree add --detach "$state" FETCH_HEAD
            python scripts/merge_state.py media_output "$state"
            if (cd "$state" && git add -A && { git diff --cached --quiet || git commit -m "Update gaming posting state ($(date -u +%F))"; }                 && git push origin HEAD:gaming-state); then
              exit 0
            fi
            git worktree remove --force "$state"
            sleep $((attempt * 15))
          done
          echo "::error::could not save posting state after 5 attempts"
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-log
          path: backend/media_output/logs/
          retention-days: 14
