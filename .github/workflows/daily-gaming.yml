name: Daily gaming videos

# Makes the day's gaming shorts (1 new/upcoming game, 1 classic game, 1 Palworld breeding
# combo), retries uploads that failed earlier, and posts to YouTube + Instagram - no laptop
# needed. "What's already posted" lives on the gaming-state branch.
on:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST
  workflow_dispatch:
    inputs:
      new_games:
        description: "New/upcoming-game videos"
        default: "1"
      classic_games:
        description: "Classic-game videos"
        default: "1"
      new_palworld:
        description: "Palworld breeding videos"
        default: "1"

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Hindi font and cloudflared
        run: |
          mkdir -p .cache/fonts
          curl -fsSL -o .cache/fonts/Hind-Bold.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf
          curl -fsSL -o .cache/fonts/Hind-Regular.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Regular.ttf
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json

      - name: Make and post videos
        env:
          DRY_RUN: "false"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube","instagram"]'
          YOUTUBE_CATEGORY_ID: "20"
          CLOUDFLARED_PATH: /usr/local/bin/cloudflared
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/daily_job.py --skip-trends
          --new-games "${{ github.event.inputs.new_games || '1' }}"
          --classic-games "${{ github.event.inputs.classic_games || '1' }}"
          --new-palworld "${{ github.event.inputs.new_palworld || '1' }}"

      - name: Save posting state
        if: always()
        run: |
          set -e
          state=$(mktemp -d)
          git worktree add "$state" origin/gaming-state
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            [ -f "media_output/$f" ] && cp "media_output/$f" "$state/"
          done
          cd "$state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update gaming posting state ($(date -u +%F))"
          git push origin HEAD:gaming-state

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-log
          path: backend/media_output/logs/
          retention-days: 14
