name: Daily long videos

# Two long-form (16:9, ~6-10 min) videos a day: 1 gaming video in English -> HarryBeast
# Gaming YouTube, and 1 movie video in Hindi -> Name Writer YouTube + Facebook. Specs live
# in backend/scripts/specs/long/. Shares the "daily-gaming" concurrency group with the
# shorts workflow so the two never write the gaming-state branch at the same time.
on:
  schedule:
    - cron: "30 12 * * *" # 18:00 IST
  workflow_dispatch:
    inputs:
      per_category:
        description: "Long videos per category (gaming, movies)"
        default: "1"

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Hindi font
        run: |
          mkdir -p .cache/fonts
          curl -fsSL -o .cache/fonts/Hind-Bold.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf
          curl -fsSL -o .cache/fonts/Hind-Regular.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Regular.ttf

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MOVIES_TOKEN_JSON: ${{ secrets.YOUTUBE_MOVIES_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json
          printf '%s' "$YOUTUBE_MOVIES_TOKEN_JSON" > .cache/youtube_token_movies.json

      - name: Make and post long videos
        env:
          DRY_RUN: "false"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube"]'
          MOVIE_PLATFORMS: '["youtube_movies","instagram","facebook"]'
          YOUTUBE_CATEGORY_ID: "20"
          YOUTUBE_MOVIES_CATEGORY_ID: "24"
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/daily_job.py --skip-trends
          --new-games 0 --classic-games 0 --new-palworld 0 --new-movies 0 --movie-reviews 0
          --long-videos "${{ github.event.inputs.per_category || '1' }}"

      - name: Save posting state
        if: always()
        run: |
          set -e
          state=$(mktemp -d)
          git worktree add "$state" origin/gaming-state
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            [ -f "media_output/$f" ] && cp "media_output/$f" "$state/"
          done
          cd "$state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update long-video posting state ($(date -u +%F))"
          git push origin HEAD:gaming-state

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-long-log
          path: backend/media_output/logs/
          retention-days: 14
