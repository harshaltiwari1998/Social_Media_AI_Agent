name: Daily Palworld guide

# One Palworld 1.0 gameplay guide short a day (best base Pals, bosses, locations, leveling...)
# from scripts/specs/games/palguide_*.json -> HarryBeast Gaming YouTube only. Separate from
# the breeding videos in daily-content.yml, which keep running. Shares the daily-gaming
# concurrency group so the two never write the gaming-state branch at the same time.
on:
  schedule:
    - cron: "30 8 * * *" # 14:00 IST
  workflow_dispatch:
    inputs:
      guides:
        description: "Palworld guide shorts"
        default: "1"

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Hindi font and cloudflared
        run: |
          mkdir -p .cache/fonts
          curl -fsSL -o .cache/fonts/Hind-Bold.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf
          curl -fsSL -o .cache/fonts/Hind-Regular.ttf https://github.com/google/fonts/raw/main/ofl/hind/Hind-Regular.ttf
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MOVIES_TOKEN_JSON: ${{ secrets.YOUTUBE_MOVIES_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json
          printf '%s' "$YOUTUBE_MOVIES_TOKEN_JSON" > .cache/youtube_token_movies.json

      - name: Make and post videos
        env:
          DRY_RUN: "false"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GAMING_PAGE_ID: ${{ secrets.META_GAMING_PAGE_ID }}
          META_GAMING_IG_USER_ID: ${{ secrets.META_GAMING_IG_USER_ID }}
          META_GAMING_ACCESS_TOKEN: ${{ secrets.META_GAMING_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube","facebook_gaming","instagram_gaming"]'
          MOVIE_PLATFORMS: '["youtube_movies","instagram","facebook"]'
          YOUTUBE_CATEGORY_ID: "20"
          YOUTUBE_MOVIES_CATEGORY_ID: "24"
          CLOUDFLARED_PATH: /usr/local/bin/cloudflared
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/daily_job.py --skip-trends
          --new-games 0 --classic-games 0 --new-palworld 0 --new-movies 0 --movie-reviews 0
          --extra-slot "palguide:${{ github.event.inputs.guides || '1' }}"

      - name: Save posting state
        if: always()
        run: |
          # Merge into the LATEST gaming-state (never copy over it): another workflow or a laptop batch may
          # have pushed since this run restored it. On a rejected push, fetch again and re-merge.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gaming-state
            state=$(mktemp -d)
            git worktree add --detach "$state" FETCH_HEAD
            python scripts/merge_state.py media_output "$state"
            if (cd "$state" && git add -A && { git diff --cached --quiet || git commit -m "Update Palworld guide posting state ($(date -u +%F))"; }                 && git push origin HEAD:gaming-state); then
              exit 0
            fi
            git worktree remove --force "$state"
            sleep $((attempt * 15))
          done
          echo "::error::could not save posting state after 5 attempts"
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palguide-log
          path: backend/media_output/logs/
          retention-days: 14
