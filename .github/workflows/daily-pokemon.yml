name: Daily free Pokemon evolution shorts

# scripts/pokemon_daily.py: free AI-motion Pokemon evolution shorts (official artwork + free Wan 2.2 on a Hugging
# Face ZeroGPU Space, HF_TOKEN secret). The free GPU quota gives ~2-3 clips a day and a short needs 4, so clips
# are kept on the motion-cache branch between runs; a finished short is posted to HarryBeast YouTube + the
# gaming Facebook Page + Instagram. No laptop needed.
on:
  schedule:
    - cron: "45 5 * * *" # 11:15 IST
  workflow_dispatch:

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pokemon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Restore posting state and clip cache
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done
          if git fetch --depth 1 origin motion-cache; then
            git archive FETCH_HEAD pokemon | tar -x -C media_output || true
          fi
          ls -R media_output/pokemon 2>/dev/null | head -40 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install cloudflared
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p .cache
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json

      - name: Make clips and post finished shorts
        env:
          DRY_RUN: "false"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          META_GAMING_PAGE_ID: ${{ secrets.META_GAMING_PAGE_ID }}
          META_GAMING_IG_USER_ID: ${{ secrets.META_GAMING_IG_USER_ID }}
          META_GAMING_ACCESS_TOKEN: ${{ secrets.META_GAMING_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube","facebook_gaming","instagram_gaming"]'
          YOUTUBE_CATEGORY_ID: "20"
          CLOUDFLARED_PATH: /usr/local/bin/cloudflared
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::warning::HF_TOKEN secret not set - the shared free quota is tiny"; fi
          python scripts/pokemon_daily.py

      - name: Save posting state
        if: always()
        run: |
          # Merge into the LATEST gaming-state (never copy over it), retry on a rejected push.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gaming-state
            state=$(mktemp -d)
            git worktree add --detach "$state" FETCH_HEAD
            python scripts/merge_state.py media_output "$state"
            if (cd "$state" && git add -A && { git diff --cached --quiet || git commit -m "Update Pokemon posting state ($(date -u +%F))"; } \
                && git push origin HEAD:gaming-state); then
              exit 0
            fi
            git worktree remove --force "$state"
            sleep $((attempt * 15))
          done
          echo "::error::could not save posting state after 5 attempts"
          exit 1

      - name: Save clip cache
        if: always()
        run: |
          set -e
          cache=$(mktemp -d)
          if git fetch --depth 1 origin motion-cache; then
            git worktree add --detach "$cache" FETCH_HEAD
          else
            git worktree add --orphan -b motion-cache "$cache"
          fi
          rm -rf "$cache/pokemon"
          mkdir -p "$cache/pokemon"
          if [ -d media_output/pokemon ]; then
            rsync -a --exclude '.work' --exclude '*_part*.mp4' --exclude '*_last*.jpg' --exclude '*_list.txt' \
              media_output/pokemon/ "$cache/pokemon/"
          fi
          touch "$cache/pokemon/.keep"
          cd "$cache"
          git add -A
          git diff --cached --quiet || git commit -m "Pokemon clip cache ($(date -u +%F))"
          git push origin HEAD:motion-cache

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-log
          path: backend/media_output/logs/
          retention-days: 14
