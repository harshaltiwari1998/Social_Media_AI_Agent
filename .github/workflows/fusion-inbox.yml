name: Pokemon fusion shorts from inbox

# The owner uploads Gemini-made fusion reveal clips to inbox/ on the GitHub website (named
# pokemon1+pokemon2.mp4). scripts/fusion_inbox.py turns each into a 9:16 short (names, type, outro) and posts it
# to HarryBeast YouTube + the gaming Facebook Page + Instagram; fully posted clips are then deleted from inbox/.
# The daily run retries uploads that failed (e.g. YouTube upload limit). No laptop needed.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  schedule:
    - cron: "45 6 * * *" # 12:15 IST - retries
  workflow_dispatch:

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install cloudflared
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p .cache
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json

      - name: Make and post fusion shorts
        env:
          DRY_RUN: "false"
          META_GAMING_PAGE_ID: ${{ secrets.META_GAMING_PAGE_ID }}
          META_GAMING_IG_USER_ID: ${{ secrets.META_GAMING_IG_USER_ID }}
          META_GAMING_ACCESS_TOKEN: ${{ secrets.META_GAMING_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          GAMING_PLATFORMS: '["youtube","facebook_gaming","instagram_gaming"]'
          YOUTUBE_CATEGORY_ID: "20"
          CLOUDFLARED_PATH: /usr/local/bin/cloudflared
          PYTHONUNBUFFERED: "1"
        run: python scripts/fusion_inbox.py

      - name: Sort new uploads into YouTube playlists
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          YOUTUBE_NONINTERACTIVE: "1"
          PYTHONUNBUFFERED: "1"
        run: python scripts/youtube_playlists.py --channel youtube

      - name: Save posting state
        if: always()
        run: |
          # Merge into the LATEST gaming-state (never copy over it), retry on a rejected push.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gaming-state
            state=$(mktemp -d)
            git worktree add --detach "$state" FETCH_HEAD
            python scripts/merge_state.py media_output "$state"
            if (cd "$state" && git add -A && { git diff --cached --quiet || git commit -m "Update fusion posting state ($(date -u +%F))"; } \
                && git push origin HEAD:gaming-state); then
              exit 0
            fi
            git worktree remove --force "$state"
            sleep $((attempt * 15))
          done
          echo "::error::could not save posting state after 5 attempts"
          exit 1

      - name: Remove posted clips from inbox
        if: success()
        run: |
          [ -s media_output/fusion_done.txt ] || exit 0
          cd ..
          while IFS= read -r name; do
            [ -n "$name" ] && [ -f "inbox/$name" ] && git rm -q "inbox/$name"
          done < backend/media_output/fusion_done.txt
          git diff --cached --quiet && exit 0
          git commit -m "Remove posted fusion clips from inbox"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-log
          path: backend/media_output/logs/
          retention-days: 14
