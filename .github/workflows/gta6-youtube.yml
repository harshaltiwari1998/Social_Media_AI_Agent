name: GTA 6 shorts to YouTube (every 2 hours)

# Owner 2026-11-23: "me office me laptop open nahi kar sakta hu to aap kuch karo jisse har 2 ghante me youtube me shorts
# jaye GTA 6 ke". The laptop pushes owner-approved, nudity-checked GTA 6 shorts (with the GTA VI logo) to the branch
# clips/gta6-youtube (scripts/gta6_youtube_cloud.py push N); every 2 hours this uploads the next one to the HarryBeast
# YouTube channel. The API quota (~10,000 units a day for both channels, 1,600 an upload) lets ~5-6 a day through - a
# run after that just ends. Only GTA 6 clips the owner approved are in that queue, so this one keeps its schedule
# (every other posting workflow is manual-only since 2026-11-16).
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-gaming
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Restore posting state
        run: |
          mkdir -p media_output
          if ! git fetch --depth 1 origin gaming-state; then
            echo "::error::gaming-state branch missing - refusing to run without the posted-videos record"
            exit 1
          fi
          for f in pipeline_store.sqlite3 palworld_videos.json game_videos.json; do
            git show "origin/gaming-state:$f" > "media_output/$f" 2>/dev/null || rm -f "media_output/$f"
          done

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Write YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p .cache
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > .cache/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .cache/youtube_token.json

      - name: Upload the next GTA 6 short
        env:
          DRY_RUN: "false"
          YOUTUBE_CLIENT_SECRET_FILE: .cache/youtube_client_secret.json
          YOUTUBE_NONINTERACTIVE: "1"
          YOUTUBE_CATEGORY_ID: "20"
          PYTHONUNBUFFERED: "1"
        run: python scripts/gta6_youtube_cloud.py post 1

      - name: Save posting state
        if: always()
        run: |
          # Merge into the LATEST gaming-state (never copy over it), retry on a rejected push.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gaming-state
            state=$(mktemp -d)
            git worktree add --detach "$state" FETCH_HEAD
            python scripts/merge_state.py media_output "$state"
            if (cd "$state" && git add -A && { git diff --cached --quiet || git commit -m "Update GTA 6 YouTube state ($(date -u +%F))"; } \
                && git push origin HEAD:gaming-state); then
              exit 0
            fi
            git worktree remove --force "$state"
            sleep $((attempt * 15))
          done
          echo "::error::could not save posting state after 5 attempts"
          exit 1
